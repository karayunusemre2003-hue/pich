<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=640" />
    <title>Jarvis Video Studio — hero</title>
    <!-- README hero / GitHub social preview (1280x640). Background: assets/hero_bg.png (text-free, generated with
         Codex image_gen, prompt in docs/hero-src/PROMPT.md). Typography and logo are added here so they stay crisp.
         Render: npx hyperframes render --output /tmp/hero.mp4 && ffmpeg -i /tmp/hero.mp4 -frames:v 1 ../hero.png -->
    <style>
      @font-face { font-family: "Manrope"; src: url("assets/Manrope.ttf") format("truetype"); font-weight: 200 800; }
      :root { --ink: #fff; --muted: #b7c6dc; --yellow: #ffd64d; --line: rgba(120, 214, 255, 0.28); }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Manrope", sans-serif; color: var(--ink); background: #0e1424; }
      #root { position: relative; width: 1280px; height: 640px; overflow: hidden; background: #0e1424; }
      .clip { position: absolute; inset: 0; }
      #bg { position: absolute; inset: 0; width: 1280px; height: 640px; object-fit: cover; object-position: center; }
      /* soft left scrim so the title stays readable on any background */
      #scrim { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10, 14, 26, 0.92) 0%, rgba(10, 14, 26, 0.75) 38%, rgba(10, 14, 26, 0) 62%); }
      #logo { position: absolute; left: 72px; top: 92px; width: 96px; height: 96px; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45)); }
      #name { position: absolute; left: 72px; top: 212px; font-size: 66px; font-weight: 800; line-height: 1.02; letter-spacing: -0.02em; }
      #name span { color: var(--yellow); }
      #tag { position: absolute; left: 74px; top: 372px; width: 560px; font-size: 25px; font-weight: 600; line-height: 1.4; color: var(--muted); }
      #tag b { color: var(--ink); font-weight: 800; }
      #chips { position: absolute; left: 72px; top: 500px; display: flex; gap: 12px; }
      .chip { padding: 9px 17px; border-radius: 999px; border: 2px solid var(--line); background: rgba(14, 20, 36, 0.72);
              font-size: 17px; font-weight: 700; color: #d6e6fa; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1280" data-height="640" data-duration="1">
      <section id="hero" class="clip" data-start="0" data-duration="1" data-track-index="0">
        <img id="bg" src="assets/hero_bg.png" alt="" />
        <div id="scrim"></div>
        <img id="logo" src="assets/logo.svg" alt="" />
        <div id="name">Jarvis<br /><span>Video Studio</span></div>
        <div id="tag">Raw talking-head take → finished vertical Reel.<br /><b>An AI agent edits, automatic QA checks.</b></div>
        <div id="chips"><div class="chip">Claude Code skill</div><div class="chip">FFmpeg</div><div class="chip">Hyperframes</div><div class="chip">MIT</div></div>
      </section>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = { duration: () => 1, seek: () => {}, pause: () => {}, time: () => 0, totalDuration: () => 1, progress: () => 0, play: () => {}, paused: () => true };
    </script>
  </body>
</html>
