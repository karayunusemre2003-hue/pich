<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B5BFF"/><stop offset="0.55" stop-color="#5B45FF"/><stop offset="1" stop-color="#9A3FFF"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A0B5C" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <g filter="url(#sh)">
    <!-- the "p": stem + a screen-shaped bowl -->
    <rect x="134" y="98" width="50" height="324" rx="25" fill="#FFFFFF"/>
    <rect x="159" y="122" width="200" height="200" rx="64" fill="none" stroke="#FFFFFF" stroke-width="50"/>
    <!-- play inside the bowl -->
    <path d="M238 186 L296 222 L238 258 Z" fill="#FFD64D" stroke="#FFD64D" stroke-width="16" stroke-linejoin="round"/>
  </g>
</svg>
